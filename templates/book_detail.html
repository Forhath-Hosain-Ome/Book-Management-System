{% extends 'base.html' %}
{% block content %}
    <div class="row">
        <div class="col-md-4">
            {% if object.cover %}<img src="{{ object.cover.url }}" class="img-fluid" />{% endif %}
        </div>
        <div class="col-md-8">
            <h2>{{ object.title }}</h2>
            <p><strong>Author:</strong> {{ object.author }}</p>
            <p><strong>Published:</strong> {{ object.published_date }}</p>
            <p>{{ object.description }}</p>


            <a href="{% url 'library:book-edit' object.pk %}" class="btn btn-primary">Edit</a>
            <a href="{% url 'library:book-delete' object.pk %}" class="btn btn-danger">Delete</a>
            <a href="{% url 'library:book-list' %}" class="btn btn-secondary">Back</a>
        </div>
    </div>
{% endblock %}
