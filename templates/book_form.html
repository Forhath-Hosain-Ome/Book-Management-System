{% extends 'base.html' %}
{% block content %}
    <h2>{% if object %}Edit{% else %}Add{% endif %} Book</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-success">Save</button>
        <a href="{% url 'library:book-list' %}" class="btn btn-secondary">Cancel</a>
    </form>
{% endblock %}
